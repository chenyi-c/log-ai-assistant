name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check src tests log-generator
      - name: Type check core modules
        run: mypy
      - name: Advisory Python dependency audit
        continue-on-error: true
        run: pip-audit -r requirements/backend.txt -r requirements/test.txt
      - name: Test in the Docker-first environment
        run: docker compose run --rm tester
      - name: Generate synthetic investigation evidence
        run: |
          mkdir -p artifacts
          docker compose run --rm tester python scripts/run_detection_evaluation.py > artifacts/detection-evaluation.json
          docker compose run --rm tester python scripts/run_investigation_pack.py --format json > artifacts/investigation-pack.json
          docker compose run --rm tester python scripts/run_interview_investigation_demo.py --format json > artifacts/interview-investigation-demo.json
          docker compose run --rm tester python scripts/run_interview_investigation_demo.py --format markdown > artifacts/interview-investigation-demo.md
      - name: Upload synthetic investigation evidence
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-investigation-evidence
          path: artifacts/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Test shared presentation helpers
        run: npm test -- --run
      - name: Audit production dependencies
        run: npm audit --omit=dev
