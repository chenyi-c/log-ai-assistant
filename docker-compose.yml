services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:29092"
      - "${KAFKA_CONTROLLER_HOST_PORT:-9093}:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw_logs}
      KAFKA_PARSED_TOPIC: ${KAFKA_PARSED_TOPIC:-parsed_logs}
      KAFKA_ANOMALY_TOPIC: ${KAFKA_ANOMALY_TOPIC:-anomaly_events}
      KAFKA_AI_JUDGEMENT_TOPIC: ${KAFKA_AI_JUDGEMENT_TOPIC:-ai_judgements}
      KAFKA_METRICS_TOPIC: ${KAFKA_METRICS_TOPIC:-system_metrics}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./scripts/create_kafka_topics.sh:/opt/app/scripts/create_kafka_topics.sh:ro
    command: ["/bin/bash", "/opt/app/scripts/create_kafka_topics.sh"]

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-log_ai}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse-migrate:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    container_name: clickhouse-migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-log_ai}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./sql/clickhouse/02_adr010_migration.sql:/migration/02_adr010_migration.sql:ro
      - ./sql/clickhouse/03_adr011_migration.sql:/migration/03_adr011_migration.sql:ro
      - ./sql/clickhouse/04_scoring_and_risk_migration.sql:/migration/04_scoring_and_risk_migration.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        clickhouse-client
        --host clickhouse
        --database "$$CLICKHOUSE_DATABASE"
        --user "$$CLICKHOUSE_USER"
        --password "$$CLICKHOUSE_PASSWORD"
        --multiquery
        < /migration/02_adr010_migration.sql &&
        clickhouse-client
        --host clickhouse
        --database "$$CLICKHOUSE_DATABASE"
        --user "$$CLICKHOUSE_USER"
        --password "$$CLICKHOUSE_PASSWORD"
        --multiquery
        < /migration/03_adr011_migration.sql &&
        clickhouse-client
        --host clickhouse
        --database "$$CLICKHOUSE_DATABASE"
        --user "$$CLICKHOUSE_USER"
        --password "$$CLICKHOUSE_PASSWORD"
        --multiquery
        < /migration/04_scoring_and_risk_migration.sql

  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink-python.Dockerfile
      args:
        FLINK_BASE_IMAGE: ${FLINK_IMAGE:-flink:1.18.1-java11}
    image: log-ai-assistant-flink-python
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "${FLINK_DASHBOARD_HOST_PORT:-8081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        rest.bind-address: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10

  flink-taskmanager:
    image: log-ai-assistant-flink-python
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m

  filebeat:
    image: ${FILEBEAT_IMAGE:-docker.elastic.co/beats/filebeat:8.13.4}
    container_name: filebeat
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/app:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      log-generator:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-ai-backend
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:-kafka:9092}
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw_logs}
      KAFKA_PARSED_TOPIC: ${KAFKA_PARSED_TOPIC:-parsed_logs}
      KAFKA_ANOMALY_TOPIC: ${KAFKA_ANOMALY_TOPIC:-anomaly_events}
      KAFKA_AI_JUDGEMENT_TOPIC: ${KAFKA_AI_JUDGEMENT_TOPIC:-ai_judgements}
      KAFKA_METRICS_TOPIC: ${KAFKA_METRICS_TOPIC:-system_metrics}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-log_ai}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      FLINK_DASHBOARD_URL: ${FLINK_DASHBOARD_URL_DOCKER:-http://flink-jobmanager:8081}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY_DOCKER:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-http://webhook-receiver:8080/alerts}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    ports:
      - "${FASTAPI_HOST_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - ./logs:/var/log/app:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      webhook-receiver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10

  anomaly-detector:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-ai-anomaly-detector
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-log_ai}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-http://webhook-receiver:8080/alerts}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - ./src:/app/src:ro
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      webhook-receiver:
        condition: service_started
    command:
      [
        "python",
        "-m",
        "src.main",
        "detect-worker",
        "--interval-seconds",
        "${ANOMALY_DETECTOR_INTERVAL_SECONDS:-1}",
        "--lookback-minutes",
        "${ANOMALY_DETECTOR_LOOKBACK_MINUTES:-10}",
        "--batch-size",
        "${ANOMALY_DETECTOR_BATCH_SIZE:-2000}",
        "--recover-state-on-start",
      ]

  operations-runner:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-ai-operations-runner
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-log_ai}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LOG_GENERATOR_MANIFEST: ${LOG_GENERATOR_MANIFEST:-/var/log/app/manifest.jsonl}
      OPERATIONS_LOCK_DIR: /var/lock/log-ai-operations
      OPERATIONS_TIMEZONE: ${OPERATIONS_TIMEZONE:-UTC}
      OPERATIONS_SCHEDULER_INTERVAL_SECONDS: ${OPERATIONS_SCHEDULER_INTERVAL_SECONDS:-60}
      OPERATIONS_MAX_ATTEMPTS: ${OPERATIONS_MAX_ATTEMPTS:-3}
      OPERATIONS_RETRY_BASE_SECONDS: ${OPERATIONS_RETRY_BASE_SECONDS:-2}
      OPERATIONS_WATERMARK_GRACE_MINUTES: ${OPERATIONS_WATERMARK_GRACE_MINUTES:-30}
      ACCEPTANCE_LOOKBACK_MINUTES: ${ACCEPTANCE_LOOKBACK_MINUTES:-2}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-http://webhook-receiver:8080/alerts}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./log-generator/scenarios:/app/log-generator/scenarios:ro
      - ./logs:/var/log/app:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.git:/app/.git:ro
      - operations_locks:/var/lock/log-ai-operations
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      webhook-receiver:
        condition: service_started
    entrypoint: ["python", "-m", "src.operations"]
    command: ["scheduler"]

  webhook-receiver:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-ai-webhook-receiver
    restart: unless-stopped
    environment:
      WEBHOOK_OUTPUT: /var/log/webhook/deliveries.jsonl
      WEBHOOK_FAIL_FIRST_N: ${WEBHOOK_FAIL_FIRST_N:-1}
    volumes:
      - webhook_deliveries:/var/log/webhook
    command: ["python", "scripts/webhook_receiver.py"]

  raw-to-parsed:
    # Fallback normalizer for local isolation only. The default formal path uses
    # Flink; do not enable this together with the default Flink parser unless you
    # intentionally want duplicate parsed_logs collapsed by ClickHouse.
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-ai-raw-to-parsed
    profiles: ["fallback"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:-kafka:9092}
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw_logs}
      KAFKA_PARSED_TOPIC: ${KAFKA_PARSED_TOPIC:-parsed_logs}
    volumes:
      - ./src:/app/src:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m src.main process-raw \
            --group-id "${RAW_TO_PARSED_GROUP_ID:-python-raw-to-parsed}" \
            --idle-timeout-ms "${RAW_TO_PARSED_IDLE_TIMEOUT_MS:-10000}" || true
          sleep "${RAW_TO_PARSED_RESTART_SECONDS:-2}"
        done

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
    container_name: log-ai-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10

  log-generator:
    build:
      context: .
      dockerfile: docker/log-generator.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-generator
    environment:
      LOG_GENERATOR_OUTPUT_DIR: ${LOG_GENERATOR_OUTPUT_DIR:-/var/log/app}
      LOG_GENERATOR_MANIFEST: ${LOG_GENERATOR_MANIFEST:-/var/log/app/manifest.jsonl}
      LOG_GENERATOR_CONFIG: ${LOG_GENERATOR_CONFIG:-/app/log-generator/scenarios/default.json}
      LOG_GENERATOR_INTERVAL_SECONDS: ${LOG_GENERATOR_INTERVAL_SECONDS:-5}
      LOG_GENERATOR_BATCH_SIZE: ${LOG_GENERATOR_BATCH_SIZE:-3}
      LOG_GENERATOR_SEED: ${LOG_GENERATOR_SEED:-42}
    volumes:
      - ./logs:/var/log/app

  log-generator-scale:
    build:
      context: .
      dockerfile: docker/log-generator.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-generator-scale
    profiles: ["scale"]
    environment:
      LOG_GENERATOR_OUTPUT_DIR: ${LOG_GENERATOR_OUTPUT_DIR:-/var/log/app}
      LOG_GENERATOR_MANIFEST: ${LOG_GENERATOR_MANIFEST:-/var/log/app/manifest.jsonl}
      LOG_GENERATOR_CONFIG: ${LOG_GENERATOR_CONFIG:-/app/log-generator/scenarios/default.json}
      LOG_GENERATOR_INTERVAL_SECONDS: ${LOG_GENERATOR_SCALE_INTERVAL_SECONDS:-1}
      LOG_GENERATOR_BATCH_SIZE: ${LOG_GENERATOR_SCALE_BATCH_SIZE:-25}
      LOG_GENERATOR_SEED: ${LOG_GENERATOR_SCALE_SEED:-4242}
    volumes:
      - ./logs:/var/log/app

  flink-submit:
    image: log-ai-assistant-flink-python
    container_name: flink-submit
    working_dir: /opt/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:-kafka:9092}
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw_logs}
      KAFKA_PARSED_TOPIC: ${KAFKA_PARSED_TOPIC:-parsed_logs}
      PYTHONPATH: /opt/app
    volumes:
      - ./flink_jobs:/opt/app/flink_jobs:ro
      - ./src:/opt/app/src:ro
      - ./requirements:/opt/app/requirements:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        flink run -m flink-jobmanager:8081 -py /opt/app/flink_jobs/raw_to_parsed.py \
          --pyFiles /opt/app \
          --bootstrap-servers "$$KAFKA_BOOTSTRAP_SERVERS" \
          --raw-topic "$$KAFKA_RAW_TOPIC" \
          --parsed-topic "$$KAFKA_PARSED_TOPIC"

  tester:
    build:
      context: .
      dockerfile: docker/tester.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: log-ai-tester
    profiles: ["test"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:-kafka:9092}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-log_ai}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      FLINK_DASHBOARD_URL: ${FLINK_DASHBOARD_URL_DOCKER:-http://flink-jobmanager:8081}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY_DOCKER:-}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./docs/evidence:/app/docs/evidence:ro
      - ./sql:/app/sql:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./config:/app/config:ro
      - ./log-generator:/app/log-generator:ro
    command: ["pytest", "-q"]

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}
    container_name: elasticsearch
    profiles: ["legacy-es"]
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:8.13.4}
    container_name: kibana
    profiles: ["legacy-es"]
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  kafka_data:
  clickhouse_data:
  frontend_node_modules:
  operations_locks:
  webhook_deliveries:
  es_data:
