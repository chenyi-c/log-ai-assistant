[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"] # Long SQL queries and user-facing explanation strings are formatter-safe as-is.

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src/operations/runner.py", "src/ueba/baseline.py"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
incremental = false
